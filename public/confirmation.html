<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Airbnb Booking | Confirmation</title>
</head>
<body>
  <div class="page-shell">
    <aside class="sidebar">
      <div class="brand">
        <h1>StayFinder</h1>
        <p>Simple booking portal</p>
      </div>

      <nav class="side-nav" aria-label="Main navigation">
        <a class="nav-item" href="/">Home</a>
        <a class="nav-item" href="/bookings.html">Bookings</a>
        <a class="nav-item active" href="/confirmation.html">Booking Confirmations</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <h2>Booking Confirmation</h2>
          <p id="status-text">Checking booking status...</p>
        </div>
      </header>

      <section class="panel">
        <h3 id="status-title">Booking Status</h3>
        <p class="panel-subtitle">Use the link below to return to the homepage.</p>

        <div class="form-actions" style="margin-top: 18px;">
          <a class="btn btn-dark" href="/">Back to Homepage</a>
        </div>
      </section>

      <footer class="footer">
        <p>ISYS3479 Assignment 4 | Web Database Application - Thashi Maleesa Godahewa (s4143272)</p>
      </footer>
    </main>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const status = params.get('status');
    const statusTitle = document.getElementById('status-title');
    const statusText = document.getElementById('status-text');

    if (status === 'success') {
      statusTitle.textContent = 'Booking Successful';
      statusText.textContent = 'Your booking has been saved successfully.';
    } else if (status === 'failed') {
      statusTitle.textContent = 'Booking Failed';
      statusText.textContent = 'Booking could not be completed. Please try again.';
    } else {
      statusTitle.textContent = 'No Booking Submitted';
      statusText.textContent = 'Submit a booking form to see confirmation here.';
    }
  </script>
</body>
</html>
